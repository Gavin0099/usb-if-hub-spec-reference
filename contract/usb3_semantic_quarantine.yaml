notes: >
  This registry does NOT itself change any page's frontmatter or claim_level.
  It only records the precondition gate. Promoting any page out of quarantine
  requires a separate, evidence-backed edit to that page's frontmatter plus an
  update to this file removing/updating its entry — not a bulk status change.
