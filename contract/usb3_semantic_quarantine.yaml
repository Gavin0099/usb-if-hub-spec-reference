schema_version: 1
title: USB 3.x Semantic Quarantine Registry
last_updated: 2026-08-03
origin: >
  Recorded per governance review commit 6ff1c56 (Verdict: CHANGES_REQUESTED),
  finding 1 [BLOCKING]: "不應立刻抽出共用 Framework" — the USB3 wiki/spec
  surface is uniformly claim_level: inferred with
  semantic_verification_claimed: false, while covering behavioral content
  (LTSSM transitions, wake/latency values, enumeration sequencing). Extracting
  a shared cross-pack Framework before this is formally quarantined risks
  formalizing an unverified semantic model that could be copied to future
  Spec Packs (e.g. USB PD).

scope: >
  This registry is the single, checkable precondition gate for any future
  work that treats specs/usb3/** content as a stable input to a shared/
  cross-pack Framework. No such work item is currently recorded in this
  repo's own PLAN.md as of 2026-07-31 (a review-session reference to "PLAN.md
  priority P3: 抽出最小 Core Framework" was found to not resolve to any
  entry in this repo's PLAN.md and has been removed). It replaces scattered
  per-page prose disclaimers as the enforcement point: any such future work
  item (and any earlier step that depends on USB3 semantic stability) MUST
  NOT proceed while `quarantine_status: active` and any listed page still
  fails its `release_conditions`.

quarantine_status: active

blocks:
  - Any future work item that treats specs/usb3/** as a stable input to a
    shared/cross-pack Framework (no such work item is currently recorded in
    this repo's PLAN.md).
  - Any cross-pack schema unification that treats specs/usb3/** as a
    semantically-verified source rather than an inferred/orientation-only
    reference.

release_conditions:
  - id: per_page_semantic_review
    description: >
      Each quarantined page below has had its behavioral claims (state
      transitions, timing/latency values, enumeration ordering) reviewed
      against an authority-A USB 3.2 source section and either (a) promoted
      to claim_level: verified with semantic_verification_claimed: true and
      explicit section_reference, or (b) explicitly re-confirmed as
      orientation-only with unchanged inferred status.
  - id: behavioral_content_boundary_explicit
    description: >
      Every page that describes LTSSM transitions, link power (U1/U2/U3)
      timing, or hub enumeration sequencing carries an explicit "本頁不宣告"
      boundary list naming the specific behavioral claims excluded (already
      present on ss_ltssm.md and ss_lpm.md as of this registry's creation;
      not yet audited page-by-page for the remaining 25 pages).
  - id: validator_coverage
    description: >
      A validator script (analogous to scripts/validate_entry_verification_gate.py)
      exists and passes, confirming every page listed below still declares
      claim_level: inferred and semantic_verification_claimed: false, so this
      registry cannot silently drift out of sync with the actual frontmatter.
      Implemented by scripts/validate_usb3_semantic_quarantine.py and covered
      by deterministic fixture smoke in
      scripts/smoke_validate_usb3_semantic_quarantine_fixtures.py.

not_yet_satisfied:
  - per_page_semantic_review
  - behavioral_content_boundary_explicit

