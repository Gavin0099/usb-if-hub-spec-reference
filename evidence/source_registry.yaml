notes:
  - This registry maps source authority and intended claim usage before runtime monitor/validator integration.
  - >-
    Resolved 2026-07-31: the unregistered archive_usb32_pdf fallback was
    removed from all 48 USB 3.x entry packets. Those packets now rely on
    the registered normative official usb32_spec primary source. The entry
    verification gate now fails when a packet document_ref names an
    unregistered primary or fallback source, preventing recurrence without
    promoting an unverified mirror or redistributing USB-IF documents.
