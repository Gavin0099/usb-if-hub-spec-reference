identity_corrections:
  - bLength corrected to bDescLength with expected value 12
  - bHubDecLat corrected to bHubHdrDecLat
  - DeviceRemovable corrected to a two-byte bitmap with bit zero reserved
  - bHubContrCurrent unit claim bounded to the applicable aCurrentUnit
  - wHubDelay corrected from average to maximum packet-forwarding delay
  - wHubCharacteristics power switching encodings 10 and 11 corrected to reserved
  - status-change endpoint wMaxPacketSize corrected to required value 2
  - status-change endpoint bInterval corrected to required value 8

claim_boundary:
  establishes:
    - governed table entry identity
    - governed field offset and size where recorded
    - governed value encoding where recorded
    - source section mapping
  cannot_establish:
    - firmware behavior
    - runtime behavior
    - electrical compliance
    - USB-IF certification
    - correctness of non-governed USB 3.x wiki pages
